[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2data"
version = "0.1.0"
description = "Turn invoices into checked, queryable data: extraction, validation, a review queue, evaluation and cost tracking."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hashim Javed" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pypdf>=4.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gemini = ["google-genai>=3.6"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27", "fpdf2>=2.8", "pillow>=10"]

[project.scripts]
doc2data = "doc2data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc2data = ["web/templates/*.html", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:.*does \\*not\\* support Decimal objects natively.*"]
